name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate content quality
        run: pnpm content:validate

      - name: Check internal-link hygiene
        run: pnpm content:check-links

      - name: Check image hygiene
        run: pnpm content:check-images

      - name: Type check & build
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: https://example.com

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Check security drift
        run: pnpm security:drift

      - name: Install Playwright (Chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke (production server)
        run: |
          pnpm start &
          npx --yes wait-on@8 http://127.0.0.1:3000 --timeout 120000
          CI=true pnpm exec playwright test
        env:
          NEXT_PUBLIC_APP_URL: https://example.com

name: Devotion Broadcast

# Manual dispatch only. Devotion authoring moved to the-morning-portion repo;
# the PR-label trigger was removed 2026-06-10 so a stray "devotion" label can
# never email subscribers from this archive. Requires typing SEND to confirm.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Post slug (e.g. 2026-03-18-the-word-that-mattered-most)'
        required: true
        type: string
      confirm:
        description: 'Type SEND to confirm emailing all Kit subscribers'
        required: true
        type: string

concurrency:
  group: devotion-broadcast
  cancel-in-progress: false

jobs:
  broadcast:
    name: Send Kit Broadcast
    if: github.event.inputs.confirm == 'SEND'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find devotion post
        id: post
        run: |
          NEW_FILE="src/posts/${{ inputs.slug }}.mdx"
          if [ ! -f "$NEW_FILE" ]; then
            echo "::error::Post file not found: $NEW_FILE"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "file=$NEW_FILE" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Found post: $NEW_FILE"
          fi

      - name: Extract post metadata
        id: meta
        if: steps.post.outputs.skip == 'false'
        env:
          MDX_FILE: ${{ steps.post.outputs.file }}
        run: |
          echo "Extracting metadata from: $MDX_FILE"

          # Use Python yaml for robust frontmatter parsing.
          # Handles YAML single-quote escaping (e.g. 'She Didn''t Go' → She Didn't Go),
          # double-quoted strings, unquoted values, and multi-line excerpts.
          python3 - <<'PYEOF'
          import os
          import sys
          from uuid import uuid4
          from datetime import datetime

          import yaml

          file_path = os.environ['MDX_FILE']
          github_output = os.environ['GITHUB_OUTPUT']

          with open(file_path, encoding='utf-8') as f:
              content = f.read()

          # Split on '---' delimiters to isolate frontmatter
          parts = content.split('---', 2)
          if len(parts) < 3:
              print('::error::Could not find YAML frontmatter in post')
              sys.exit(1)

          fm = yaml.safe_load(parts[1])
          body = parts[2]

          title   = str(fm.get('title',   '')).strip()
          excerpt = str(fm.get('excerpt', '')).strip()
          date    = str(fm.get('date',    '')).strip()
          slug    = os.path.basename(file_path).replace('.mdx', '')

          # Format date as "Monday, March 30" for the email header
          try:
              dt = datetime.strptime(date, '%Y-%m-%d')
              formatted_date = dt.strftime('%A, %B %-d')
          except Exception:
              formatted_date = date

          # Extract the opening blockquote verse (line starting with "> ")
          verse = ''
          for line in body.splitlines():
              stripped = line.strip()
              if stripped.startswith('> ') or stripped == '>':
                  verse = stripped.lstrip('> ').strip()
                  break

          # Render the post body to inline-styled HTML for the email.
          # Skips the opening blockquote (the KJV core verse) so it is not
          # duplicated under the title block, where it is already rendered
          # with prominent gold styling.
          import re

          P_STYLE  = ('font-family:Georgia,serif;font-size:16px;'
                      'line-height:1.7;color:#3a3a3a;margin:0 0 18px 0;')
          H2_STYLE = ('font-family:Georgia,serif;font-size:20px;'
                      'font-weight:bold;color:#1a1a1a;'
                      'margin:32px 0 14px 0;line-height:1.3;')
          BQ_STYLE   = ('border-left:3px solid #e0d6b8;margin:0 0 22px 0;'
                        'padding:8px 0 8px 16px;')
          BQ_P_STYLE = ('font-family:Georgia,serif;font-size:16px;'
                        'line-height:1.7;font-style:italic;'
                        'color:#5a5a5a;margin:0;')

          def md_inline(s):
              s = re.sub(r'\*\*(.+?)\*\*', r'<strong>\1</strong>', s)
              s = re.sub(r'(?<!\*)\*([^*\n]+?)\*(?!\*)', r'<em>\1</em>', s)
              s = re.sub(r'(?<!_)_([^_\n]+?)_(?!_)', r'<em>\1</em>', s)
              return s

          # Drop the opening verse blockquote from the body lines so the
          # KJV verse is rendered exactly once (above, in the header block).
          body_lines = body.splitlines()
          for i, line in enumerate(body_lines):
              stripped = line.strip()
              if stripped.startswith('> ') or stripped == '>':
                  cut = i + 1
                  while cut < len(body_lines) and not body_lines[cut].strip():
                      cut += 1
                  body_lines = body_lines[cut:]
                  break
              if stripped:
                  break

          html_blocks = []
          buf = []
          state = {'mode': 'p'}  # dict so flush() can mutate without `global`

          def flush():
              if not buf:
                  return
              text = ' '.join(s.strip() for s in buf).strip()
              buf.clear()
              if not text:
                  return
              text = md_inline(text)
              if state['mode'] == 'p':
                  html_blocks.append(f'<p style="{P_STYLE}">{text}</p>')
              else:
                  html_blocks.append(
                      f'<blockquote style="{BQ_STYLE}">'
                      f'<p style="{BQ_P_STYLE}">{text}</p>'
                      '</blockquote>'
                  )

          for raw in body_lines:
              stripped = raw.strip()
              if not stripped:
                  flush()
                  state['mode'] = 'p'
                  continue
              if stripped.startswith('## '):
                  flush()
                  heading = md_inline(stripped[3:].strip())
                  html_blocks.append(f'<h2 style="{H2_STYLE}">{heading}</h2>')
                  state['mode'] = 'p'
                  continue
              if stripped.startswith('> ') or stripped == '>':
                  if state['mode'] != 'bq':
                      flush()
                      state['mode'] = 'bq'
                  buf.append(stripped[1:].lstrip())
                  continue
              if state['mode'] != 'p':
                  flush()
                  state['mode'] = 'p'
              buf.append(stripped)

          flush()
          body_html = '\n'.join(html_blocks)

          print(f'Title:          {title}')
          print(f'Formatted date: {formatted_date}')
          print(f'Excerpt:        {excerpt[:80]}{"..." if len(excerpt) > 80 else ""}')
          print(f'Verse:          {verse[:80]}{"..." if len(verse) > 80 else ""}')
          print(f'Date:           {date}')
          print(f'Slug:           {slug}')
          print(f'Body HTML:      {len(body_html)} chars, {len(html_blocks)} blocks')

          def write_output(out, name, value):
              delimiter = f'EOF_{name}_{uuid4().hex}'
              out.write(f'{name}<<{delimiter}\n')
              out.write(f'{value}\n')
              out.write(f'{delimiter}\n')

          with open(github_output, 'a', encoding='utf-8') as out:
              write_output(out, 'title', title)
              write_output(out, 'excerpt', excerpt)
              write_output(out, 'formatted_date', formatted_date)
              write_output(out, 'verse', verse)
              write_output(out, 'body_html', body_html)
              write_output(out, 'date', date)
              write_output(out, 'slug', slug)
          PYEOF

      - name: Send Kit broadcast
        id: send_broadcast
        if: steps.post.outputs.skip == 'false'
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          POST_TITLE: ${{ steps.meta.outputs.title }}
          POST_EXCERPT: ${{ steps.meta.outputs.excerpt }}
          POST_FORMATTED_DATE: ${{ steps.meta.outputs.formatted_date }}
          POST_VERSE: ${{ steps.meta.outputs.verse }}
          POST_BODY_HTML: ${{ steps.meta.outputs.body_html }}
          POST_SLUG: ${{ steps.meta.outputs.slug }}
        run: |
          # Validate required secrets/vars up front with clear error messages
          if [ -z "$KIT_API_KEY" ]; then
            echo "::error::KIT_API_KEY secret is not set."
            echo "Go to: GitHub repo → Settings → Secrets and variables → Actions → New repository secret"
            echo "Name: KIT_API_KEY  |  Value: your Kit v4 API key (kit.com → Settings → Developer → API keys)"
            exit 1
          fi

          if [ -z "$NEXT_PUBLIC_APP_URL" ]; then
            echo "::warning::NEXT_PUBLIC_APP_URL variable not set — post link will be relative."
            echo "Go to: GitHub repo → Settings → Secrets and variables → Actions → Variables tab → New repository variable"
            NEXT_PUBLIC_APP_URL="https://yourdomain.com"
          fi

          POST_URL="${NEXT_PUBLIC_APP_URL}/blog/${POST_SLUG}"
          SEND_AT=$(date -u -d '+2 minutes' +%Y-%m-%dT%H:%M:%SZ)

          # Build a clean, inbox-safe HTML email via jq.
          # Layout: preheader → banner → date header → title → verse blockquote → full devotion body → "read on the web" link → footer
          HTML_CONTENT=$(jq -rn \
            --arg date          "$POST_FORMATTED_DATE" \
            --arg title         "$POST_TITLE" \
            --arg verse         "$POST_VERSE" \
            --arg excerpt       "$POST_EXCERPT" \
            --arg body_html     "$POST_BODY_HTML" \
            --arg url           "$POST_URL" \
            --arg daily_word_url "${NEXT_PUBLIC_APP_URL}/daily-word" \
            '
            "<div style=\"font-family: Georgia, serif; max-width: 600px; margin: 0 auto; color: #1a1a1a; padding: 0 16px;\">"
            + "<span style=\"display:none; max-height:0; overflow:hidden; opacity:0; color:transparent; mso-hide:all;\">" + $excerpt + "</span>"
            + "<p style=\"margin: 0 0 24px 0;\">"
            +   "<a href=\"" + $url + "\" style=\"display: block; text-decoration: none;\">"
            +     "<img src=\"https://www.saucy.tech/images/daily-word-banner.png\" width=\"600\" alt=\"The Daily Word\" style=\"display: block; width: 100%; max-width: 600px; height: auto; margin: 0 auto; border: 0;\" />"
            +   "</a>"
            + "</p>"
            + "<p style=\"font-size: 13px; color: #888888; letter-spacing: 0.05em; text-transform: uppercase; margin: 0 0 24px 0;\">" + $date + "</p>"
            + "<h1 style=\"font-family: Georgia, serif; font-size: 24px; font-weight: bold; color: #1a1a1a; margin: 0 0 20px 0; line-height: 1.3;\">" + $title + "</h1>"
            + "<blockquote style=\"border-left: 3px solid #c9a84c; margin: 0 0 28px 0; padding: 12px 0 12px 20px;\">"
            +   "<p style=\"font-size: 18px; line-height: 1.6; font-style: italic; color: #2c2c2c; margin: 0;\">" + $verse + "</p>"
            + "</blockquote>"
            + $body_html
            + "<p style=\"margin: 8px 0 0 0; font-size: 14px;\">"
            +   "<a href=\"" + $url + "\" style=\"color: #c9a84c; text-decoration: underline;\">Read on the web &rarr;</a>"
            + "</p>"
            + "<hr style=\"border: none; border-top: 1px solid #e0e0e0; margin: 32px 0 16px 0;\" />"
            + "<p style=\"font-size: 13px; line-height: 1.6; color: #888888; text-align: center; margin: 0 0 8px 0;\">Know someone who would enjoy this? <a href=\"" + $daily_word_url + "\" style=\"color: #c9a84c; text-decoration: underline;\">Share The Daily Word</a></p>"
            + "<p style=\"font-size: 12px; line-height: 1.6; color: #888888; text-align: center; margin: 0;\">You&#39;re receiving this because you subscribed to The Daily Word &middot; <a href=\"" + $daily_word_url + "\" style=\"color: #888888; text-decoration: underline;\">saucy.tech</a></p>"
            + "</div>"
            ')

          CREATE_PAYLOAD=$(jq -n \
            --arg subject  "$POST_TITLE" \
            --arg content  "$HTML_CONTENT" \
            --arg preview_text "$POST_EXCERPT" \
            --arg send_at  "$SEND_AT" \
            '{subject: $subject, content: $content, preview_text: $preview_text, send_at: $send_at}')

          echo "--- Broadcast details ---"
          echo "Subject:    $POST_TITLE"
          echo "Post URL:   $POST_URL"
          echo "Sending at: $SEND_AT"
          echo "Payload:"
          echo "$CREATE_PAYLOAD" | jq .

          echo "--- Calling Kit API v4 ---"
          CREATE_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.kit.com/v4/broadcasts" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "X-Kit-Api-Key: ${KIT_API_KEY}" \
            -d "$CREATE_PAYLOAD")

          HTTP_CODE=$(echo "$CREATE_RESPONSE" | tail -1)
          BODY=$(echo "$CREATE_RESPONSE" | sed '$d')

          echo "HTTP status: $HTTP_CODE"
          echo "Response body:"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Kit API returned HTTP $HTTP_CODE. Check API key and payload above."
            exit 1
          fi

          BROADCAST_ID=$(echo "$BODY" | jq -r '.broadcast.id // .id // empty')
          {
            echo "broadcast_id=${BROADCAST_ID}"
            echo "post_url=${POST_URL}"
          } >> "$GITHUB_OUTPUT"
          echo "✓ Broadcast created (ID: ${BROADCAST_ID:-unknown}), scheduled for $SEND_AT"

name: Devotion Broadcast

# Triggers when a PR with the "devotion" label is merged into main.
# Can also be triggered manually via workflow_dispatch with a post slug.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      slug:
        description: 'Post slug (e.g. 2026-03-18-the-word-that-mattered-most)'
        required: true
        type: string

jobs:
  broadcast:
    name: Send Kit Broadcast
    # On PR: only run when merged with the "devotion" label.
    # On manual dispatch: always run.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'devotion'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find new devotion post
        id: post
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NEW_FILE="src/posts/${{ inputs.slug }}.mdx"
            if [ ! -f "$NEW_FILE" ]; then
              echo "::error::Post file not found: $NEW_FILE"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "file=$NEW_FILE" >> "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "Found post: $NEW_FILE"
            fi
          else
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.merge_commit_sha }}"
            echo "Checking diff: $BASE → $HEAD"

            NEW_FILE=$(git diff --name-only --diff-filter=A "$BASE" "$HEAD" -- 'src/posts/*.mdx' | head -1)

            if [ -z "$NEW_FILE" ]; then
              echo "No new MDX post found in this PR — skipping broadcast."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "file=$NEW_FILE" >> "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "Found post: $NEW_FILE"
            fi
          fi

      - name: Extract post metadata
        id: meta
        if: steps.post.outputs.skip == 'false'
        env:
          MDX_FILE: ${{ steps.post.outputs.file }}
        run: |
          echo "Extracting metadata from: $MDX_FILE"

          # Use Python yaml for robust frontmatter parsing.
          # Handles YAML single-quote escaping (e.g. 'She Didn''t Go' → She Didn't Go),
          # double-quoted strings, unquoted values, and multi-line excerpts.
          python3 - <<'PYEOF'
          import yaml, sys, os, re
          from datetime import datetime

          file_path = os.environ['MDX_FILE']
          github_output = os.environ['GITHUB_OUTPUT']

          with open(file_path, encoding='utf-8') as f:
              content = f.read()

          # Split on '---' delimiters to isolate frontmatter
          parts = content.split('---', 2)
          if len(parts) < 3:
              print('::error::Could not find YAML frontmatter in post')
              sys.exit(1)

          fm = yaml.safe_load(parts[1])
          body = parts[2]

          title   = str(fm.get('title',   '')).strip()
          excerpt = str(fm.get('excerpt', '')).strip()
          date    = str(fm.get('date',    '')).strip()
          slug    = os.path.basename(file_path).replace('.mdx', '')

          # Format date as "Monday, March 30" for the email header
          try:
              dt = datetime.strptime(date, '%Y-%m-%d')
              formatted_date = dt.strftime('%A, %B %-d')
          except Exception:
              formatted_date = date

          # Extract the opening blockquote verse (line starting with "> ")
          verse = ''
          for line in body.splitlines():
              stripped = line.strip()
              if stripped.startswith('> ') or stripped == '>':
                  verse = stripped.lstrip('> ').strip()
                  break

          # Build summary: collect first 3 non-empty prose paragraphs
          # (skip headings, blockquotes, blank lines)
          prose_lines = []
          for line in body.splitlines():
              stripped = line.strip()
              if (stripped
                  and not stripped.startswith('#')
                  and not stripped.startswith('>')
                  and not stripped.startswith('---')):
                  prose_lines.append(stripped)
              if len(prose_lines) >= 3:
                  break
          summary = ' '.join(prose_lines)

          print(f'Title:          {title}')
          print(f'Formatted date: {formatted_date}')
          print(f'Excerpt:        {excerpt[:80]}{"..." if len(excerpt) > 80 else ""}')
          print(f'Verse:          {verse[:80]}{"..." if len(verse) > 80 else ""}')
          print(f'Date:           {date}')
          print(f'Slug:           {slug}')

          # Use multiline output syntax (heredoc) so newlines in values are safe
          with open(github_output, 'a', encoding='utf-8') as out:
              out.write(f'title={title}\n')
              out.write(f'excerpt={excerpt}\n')
              out.write(f'formatted_date={formatted_date}\n')
              out.write(f'verse={verse}\n')
              out.write(f'summary={summary}\n')
              out.write(f'date={date}\n')
              out.write(f'slug={slug}\n')
          PYEOF

      - name: Send Kit broadcast
        if: steps.post.outputs.skip == 'false'
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          POST_TITLE: ${{ steps.meta.outputs.title }}
          POST_EXCERPT: ${{ steps.meta.outputs.excerpt }}
          POST_FORMATTED_DATE: ${{ steps.meta.outputs.formatted_date }}
          POST_VERSE: ${{ steps.meta.outputs.verse }}
          POST_SUMMARY: ${{ steps.meta.outputs.summary }}
          POST_SLUG: ${{ steps.meta.outputs.slug }}
        run: |
          # Validate required secrets/vars up front with clear error messages
          if [ -z "$KIT_API_KEY" ]; then
            echo "::error::KIT_API_KEY secret is not set."
            echo "Go to: GitHub repo → Settings → Secrets and variables → Actions → New repository secret"
            echo "Name: KIT_API_KEY  |  Value: your Kit v4 API key (kit.com → Settings → Developer → API keys)"
            exit 1
          fi

          if [ -z "$NEXT_PUBLIC_APP_URL" ]; then
            echo "::warning::NEXT_PUBLIC_APP_URL variable not set — post link will be relative."
            echo "Go to: GitHub repo → Settings → Secrets and variables → Actions → Variables tab → New repository variable"
            NEXT_PUBLIC_APP_URL="https://yourdomain.com"
          fi

          POST_URL="${NEXT_PUBLIC_APP_URL}/blog/${POST_SLUG}"
          SEND_AT=$(date -u -d '+2 minutes' +%Y-%m-%dT%H:%M:%SZ)

          # Build a clean, inbox-safe HTML email via jq.
          # Layout: preheader → banner → date header → verse blockquote → excerpt → summary → CTA → footer
          HTML_CONTENT=$(jq -rn \
            --arg date    "$POST_FORMATTED_DATE" \
            --arg verse   "$POST_VERSE" \
            --arg excerpt "$POST_EXCERPT" \
            --arg summary "$POST_SUMMARY" \
            --arg url     "$POST_URL" \
            '
            "<div style=\"font-family: Georgia, serif; max-width: 600px; margin: 0 auto; color: #1a1a1a; padding: 0 16px;\">"
            + "<span style=\"display:none; max-height:0; overflow:hidden; opacity:0; color:transparent; mso-hide:all;\">" + $excerpt + "</span>"
            + "<p style=\"margin: 0 0 24px 0;\">"
            +   "<a href=\"" + $url + "\" style=\"display: block; text-decoration: none;\">"
            +     "<img src=\"https://saucytech.com/images/daily-word-banner.png\" width=\"600\" alt=\"The Daily Word\" style=\"display: block; width: 100%; max-width: 600px; height: auto; margin: 0 auto; border: 0;\" />"
            +   "</a>"
            + "</p>"
            + "<p style=\"font-size: 13px; color: #888888; letter-spacing: 0.05em; text-transform: uppercase; margin: 0 0 24px 0;\">" + $date + "</p>"
            + "<blockquote style=\"border-left: 3px solid #c9a84c; margin: 0 0 24px 0; padding: 12px 0 12px 20px;\">"
            +   "<p style=\"font-size: 18px; line-height: 1.6; font-style: italic; color: #2c2c2c; margin: 0;\">" + $verse + "</p>"
            + "</blockquote>"
            + "<p style=\"font-size: 16px; line-height: 1.7; color: #3a3a3a; margin: 0 0 16px 0;\">" + $excerpt + "</p>"
            + "<p style=\"font-size: 16px; line-height: 1.7; color: #3a3a3a; margin: 0 0 28px 0;\">" + $summary + "</p>"
            + "<p style=\"margin: 0 0 24px 0;\">"
            +   "<a href=\"" + $url + "\" style=\"background: #c9a84c; color: #ffffff; padding: 12px 24px; font-family: sans-serif; border-radius: 0; display: inline-block; text-decoration: none;\">Continue reading &rarr;</a>"
            + "</p>"
            + "<p style=\"font-size: 12px; line-height: 1.6; color: #888888; text-align: center; margin: 0;\">You&#39;re receiving this because you subscribed to The Daily Word &middot; saucytech.com</p>"
            + "</div>"
            ')

          CREATE_PAYLOAD=$(jq -n \
            --arg subject  "$POST_TITLE" \
            --arg content  "$HTML_CONTENT" \
            --arg preview_text "$POST_EXCERPT" \
            --arg send_at  "$SEND_AT" \
            '{subject: $subject, content: $content, preview_text: $preview_text, send_at: $send_at}')

          echo "--- Broadcast details ---"
          echo "Subject:    $POST_TITLE"
          echo "Post URL:   $POST_URL"
          echo "Sending at: $SEND_AT"
          echo "Payload:"
          echo "$CREATE_PAYLOAD" | jq .

          echo "--- Calling Kit API v4 ---"
          CREATE_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.kit.com/v4/broadcasts" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "X-Kit-Api-Key: ${KIT_API_KEY}" \
            -d "$CREATE_PAYLOAD")

          HTTP_CODE=$(echo "$CREATE_RESPONSE" | tail -1)
          BODY=$(echo "$CREATE_RESPONSE" | sed '$d')

          echo "HTTP status: $HTTP_CODE"
          echo "Response body:"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Kit API returned HTTP $HTTP_CODE. Check API key and payload above."
            exit 1
          fi

          BROADCAST_ID=$(echo "$BODY" | jq -r '.broadcast.id // .id // empty')
          echo "✓ Broadcast created (ID: ${BROADCAST_ID:-unknown}), scheduled for $SEND_AT"

      - name: Comment on PR
        if: steps.post.outputs.skip == 'false' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          POST_SLUG: ${{ steps.meta.outputs.slug }}
        run: |
          POST_URL="${{ vars.NEXT_PUBLIC_APP_URL }}/blog/${POST_SLUG}"
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "**The Daily Word broadcast sent!**

          Post URL: ${POST_URL}

          The broadcast has been scheduled to send to all Daily Word subscribers via Kit."
